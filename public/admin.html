<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>Admin SYSPTV</title></head>
<body class="bg-gray-100 p-6"><div class="max-w-xl mx-auto bg-white p-6 rounded shadow">
<h1 class="font-bold text-xl mb-4">⚙️ Configuración SYSPTV - Empresa y Sucursal</h1>
<div class="grid grid-cols-2 gap-3">
<input id="ID_SUCURSAL" placeholder="ID_SUCURSAL (1)" class="border p-2 rounded">
<input id="ID_EMP" placeholder="ID_EMP (01)" class="border p-2 rounded">
<input id="CVE_TAL" placeholder="CVE_TAL (01)" class="border p-2 rounded">
<input id="NUM_ALM" placeholder="NUM_ALM (01)" class="border p-2 rounded">
<input id="CVE_VEN" placeholder="CVE_VEN (01)" class="border p-2 rounded">
<input id="TIPO_PED" placeholder="TIPO_PED (WEB)" class="border p-2 rounded">
</div>
<input id="NOMBRE_TIENDA" placeholder="Nombre Tienda" class="border p-2 rounded w-full mt-3">
<input id="WHATSAPP_REPARTO" placeholder="WhatsApp Reparto (ej 525512345678)" class="border p-2 rounded w-full mt-3">
<button onclick="guardar()" class="bg-black text-white w-full p-3 rounded mt-4">Guardar Configuración</button>
<div id="msg" class="mt-3 text-sm"></div>
<a href="/" class="text-blue-600 text-sm mt-4 block">← Volver a Tienda</a>
</div>
<script>
async function load(){ const c=await fetch('/api/config').then(r=>r.json()); for(let k in c){ if(document.getElementById(k)) document.getElementById(k).value=c[k]; } }
async function guardar(){ const data={}; ['ID_SUCURSAL','ID_EMP','CVE_TAL','NUM_ALM','CVE_VEN','TIPO_PED','WHATSAPP_REPARTO','NOMBRE_TIENDA'].forEach(id=> data[id]=document.getElementById(id).value); const r=await fetch('/api/config',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)}).then(r=>r.json()); document.getElementById('msg').innerText=r.ok?'✅ Guardado! Ya tus pedidos se ligarán a Empresa '+data.ID_EMP+' Suc '+data.ID_SUCURSAL:'Error: '+r.error; }
load();
</script></body></html>
