<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - SYSPTV</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}body{background:#F8FAFC;color:#0F172A;display:flex;min-height:100vh}.sidebar{width:260px;background:#0F172A;color:#fff;padding:20px;position:sticky;top:0;height:100vh}.sidebar a{display:block;padding:12px 14px;border-radius:12px;color:#CBD5E1;text-decoration:none;margin:6px 0;cursor:pointer}.sidebar a.active,.sidebar a:hover{background:#1E293B;color:#fff}.main{flex:1;padding:24px}.card{background:#fff;border:1px solid #E2E8F0;border-radius:20px;padding:20px;margin-bottom:20px}.btn{background:#059669;color:#fff;border:0;padding:10px 16px;border-radius:12px;font-weight:700;cursor:pointer}.ipt{width:100%;padding:10px;border:1px solid #E2E8F0;border-radius:10px;margin:6px 0}table{width:100%;border-collapse:collapse}th{color:#64748B;font-size:12px;text-align:left;padding:10px;border-bottom:1px solid #E2E8F0}td{padding:10px;border-bottom:1px solid #F1F5F9;font-size:13px}#login{position:fixed;inset:0;background:#0F172A;display:flex;align-items:center;justify-content:center;z-index:999}</style></head><body>
<div id="login"><div class="card" style="width:340px"><h3>Admin Login</h3><br><input id="au" class="ipt" placeholder="admin"><input id="ap" class="ipt" type="password" placeholder="Admin2026!"><button class="btn" style="width:100%" onclick="login()">Entrar</button></div></div>
<div class="sidebar"><h2>TIENDA SYSPTV</h2><a id="m-pedidos" class="active" onclick="show('pedidos')">📦 Pedidos</a><a id="m-productos" onclick="show('productos')">📚 Productos</a><a id="m-clientes" onclick="show('clientes')">👥 Clientes + GPS</a><a id="m-config" onclick="show('config')">⚙️ Config Empresa</a><br><br><a onclick="location.href='/'">← Tienda</a><a onclick="logout()">Salir</a></div>
<div class="main"><div id="view-pedidos"><div class="card"><h3>Pedidos TH_PEDIDO</h3><br><table id="tbl-pedidos"><thead><tr><th>Folio</th><th>Cliente</th><th>Tel</th><th>Dirección</th><th>Total</th><th>Fecha</th><th>Maps</th></tr></thead><tbody></tbody></table></div></div>
<div id="view-productos" style="display:none"><div class="card"><h3>Productos + Subir Imagen por CVE</h3><br><input id="cve-img" class="ipt" placeholder="CVE Ej: 12345" style="width:200px;display:inline-block"> <input type="file" id="file-img"><button class="btn" onclick="subirImg()">Subir Imagen</button><p id="msg-img" style="margin-top:10px"></p><br><table id="tbl-prod"><thead><tr><th>Img</th><th>CVE</th><th>Nombre</th><th>Precio</th></tr></thead><tbody></tbody></table></div></div>
<div id="view-clientes" style="display:none"><div class="card"><h3>Clientes con Ubicación</h3><br><table id="tbl-clientes"><thead><tr><th>CVE</th><th>Nombre</th><th>Dirección</th><th>GPS</th></tr></thead><tbody></tbody></table></div></div>
<div id="view-config" style="display:none"><div class="card"><h3>Configuración Empresa CFG_TIENDA_WEB</h3><br><input id="cfg-suc" class="ipt" placeholder="ID_SUCURSAL"><input id="cfg-emp" class="ipt" placeholder="ID_EMP 17072026"><input id="cfg-nom" class="ipt" placeholder="NOMBRE_TIENDA"><input id="cfg-whats" class="ipt" placeholder="WHATSAPP_REPARTO"><button class="btn" onclick="guardarCfg()">Guardar Config</button></div></div>
</div>
<script>
let cfg=null;
function login(){ const u=document.getElementById('au').value, p=document.getElementById('ap').value; fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:u,pass:p})}).then(r=>{ if(r.ok){ localStorage.setItem('admin','1'); document.getElementById('login').style.display='none'; init(); } else alert('No'); }); }
function logout(){ localStorage.removeItem('admin'); location.reload(); }
function show(v){ document.querySelectorAll('[id^="view-"]').forEach(d=>d.style.display='none'); document.getElementById('view-'+v).style.display='block'; document.querySelectorAll('.sidebar a').forEach(a=>a.classList.remove('active')); document.getElementById('m-'+v).classList.add('active'); if(v==='pedidos') cargarPedidos(); if(v==='productos') cargarProductos(); if(v==='clientes') cargarClientes(); if(v==='config') cargarCfg(); }
async function init(){ if(!localStorage.getItem('admin')) return; document.getElementById('login').style.display='none'; cargarPedidos(); cargarCfg(); }
async function cargarPedidos(){ const r=await fetch('/api/admin/pedidos').then(r=>r.json()); const tb=document.querySelector('#tbl-pedidos tbody'); tb.innerHTML=''; r.forEach(p=>{ const total=Number(p.SUB_TOT||0)+Number(p.IVA_TOT||0); tb.innerHTML+=`<tr><td>#${p.NUM_PED}</td><td>${p.DES_CTE||''}</td><td>${p.CVE_CTE}</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis">${p.DIRECCION||''}</td><td style="color:#047857;font-weight:700">$${total.toFixed(2)}</td><td>${new Date(p.FEC_PED).toLocaleString()}</td><td>${p.LAT?`<a href="https://maps.google.com/?q=${p.LAT},${p.LNG}" target="_blank">📍 Ver</a>`:''}</td></tr>`; }); }
async function cargarProductos(){ const r=await fetch('/api/productos').then(r=>r.json()); const tb=document.querySelector('#tbl-prod tbody'); tb.innerHTML=''; r.slice(0,100).forEach(p=>{ tb.innerHTML+=`<tr><td><img src="/img/${p.cve}.jpg" style="width:40px;height:40px;border-radius:8px;object-fit:cover" onerror="this.style.display='none'"></td><td>${p.cve}</td><td>${p.nombre}</td><td>$${Number(p.precio).toFixed(2)}</td></tr>`; }); }
async function cargarClientes(){ const r=await fetch('/api/admin/clientes').then(r=>r.json()); const tb=document.querySelector('#tbl-clientes tbody'); tb.innerHTML=''; r.forEach(c=>{ tb.innerHTML+=`<tr><td>${c.CVE_CTE}</td><td>${c.DES_CTE}</td><td>${c.DIRECCION||''}</td><td>${c.LAT?`<a href="https://maps.google.com/?q=${c.LAT},${c.LNG}" target="_blank">${c.LAT},${c.LNG}</a>`:''}</td></tr>`; }); }
async function cargarCfg(){ const r=await fetch('/api/config').then(r=>r.json()); cfg=r; document.getElementById('cfg-suc').value=r.ID_SUCURSAL; document.getElementById('cfg-emp').value=r.ID_EMP; document.getElementById('cfg-nom').value=r.NOMBRE_TIENDA; document.getElementById('cfg-whats').value=r.WHATSAPP_REPARTO||''; }
async function guardarCfg(){ const body={ID_SUCURSAL:document.getElementById('cfg-suc').value, ID_EMP:document.getElementById('cfg-emp').value, NOMBRE_TIENDA:document.getElementById('cfg-nom').value, WHATSAPP_REPARTO:document.getElementById('cfg-whats').value}; await fetch('/api/admin/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); alert('Guardado'); }
async function subirImg(){ const cve=document.getElementById('cve-img').value.trim(); const file=document.getElementById('file-img').files[0]; if(!cve||!file) return alert('Pon CVE y archivo'); const fd=new FormData(); fd.append('imagen',file); fd.append('cve',cve); const r=await fetch('/api/upload-imagen',{method:'POST',body:fd}).then(r=>r.json()); document.getElementById('msg-img').innerText='✅ Subido: '+r.file; }
if(localStorage.getItem('admin')) init();
</script></body></html>
