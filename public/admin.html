<div id="sec-pedidos" class="hidden">
<h1 class="font-bold text-[20px]">Pedidos</h1>
<div class="mt-3 bg-white rounded-xl border overflow-auto">
<table class="w-full text-[12px] min-w-[900px]">
<thead class="bg-[#F8F5F5] text-[11px] uppercase font-bold text-slate-500">
<tr>
<th class="px-3 py-2.5 text-left">Folio</th>
<th class="px-3 py-2.5 text-left">Cliente</th>
<th class="px-3 py-2.5 text-left">Importe</th>
<th class="px-3 py-2.5 text-left">Dirección</th>
<th class="px-3 py-2.5 text-left">Origen (tienda)</th>
<th class="px-3 py-2.5 text-left">Destino (cliente)</th>
<th class="px-3 py-2.5 text-left">Estatus</th>
<th class="px-3 py-2.5 text-left">Detalle</th>
</tr>
</thead>
<tbody id="pedidos-tbody"></tbody>
</table>
</div>
<div id="pedidos-list-movil" class="md:hidden mt-3"></div>

<div id="pedido-detalle" class="hidden fixed inset-0 bg-black/50 p-4 z-50 grid place-items-center"><div class="bg-white rounded-xl p-4 w-full max-w-[650px] max-h-[90vh] overflow-auto"><div class="flex justify-between items-center"><h3 class="font-bold">Detalle Pedido <span id="detalle-folio"></span></h3><button onclick="document.getElementById('pedido-detalle').classList.add('hidden')" class="bg-black text-white w-7 h-7 rounded-full text-[12px]">X</button></div><div id="pedido-detalle-cont" class="mt-3 text-[12px]"></div></div></div>
</div>

<script>
async function cargarPedidos(){
  const tbody=document.getElementById('pedidos-tbody');
  const movil=document.getElementById('pedidos-list-movil');
  if(tbody) tbody.innerHTML='<tr><td colspan=8 class="px-3 py-4">Cargando...</td></tr>';
  try{
    const r=await fetch('/api/admin/pedidos').then(r=>r.json());
    if(!r.length){ tbody.innerHTML='<tr><td colspan=8 class="px-3 py-4 text-slate-400">Sin pedidos</td></tr>'; return; }
    tbody.innerHTML=r.map(p=>{
      const total=((p.SUB_TOT||0)+(p.IVA_TOT||0)).toFixed(2);
      const estatus = p.STA_PED || 'P';
      const estColor = estatus==='P'?'bg-yellow-100 text-yellow-800':estatus==='E'?'bg-blue-100 text-blue-800':estatus==='C'?'bg-red-100 text-red-800':'bg-green-100 text-green-800';
      const fecha = new Date(p.FEC_PED).toLocaleString();
      const cliente = `${p.DES_CTE||''} <br><span class="text-[10px] text-slate-400">${p.CVE_CTE} - ${fecha}</span>`;
      const dir = `<span class="line-clamp-2">${p.DIRECCION||'Sin dirección'}</span>`;
      const origen = p.PED_LAT? `<a href="https://www.google.com/maps?q=${p.PED_LAT},${p.PED_LNG}" target="_blank" class="underline text-blue-600 text-[11px]">📍 Ver origen</a><br><span class="text-[9px] text-slate-400">${p.PED_LAT},${p.PED_LNG}</span>` : '<span class="text-[10px] text-slate-400">Sin GPS</span>';
      const destino = p.LAT? `<a href="https://www.google.com/maps?q=${p.LAT},${p.LNG}" target="_blank" class="underline text-green-600 text-[11px]">📍 Ver destino</a><br><span class="text-[9px] text-slate-400">${p.LAT},${p.LNG}</span>` : (p.LNG?`<a href="https://www.google.com/maps?q=${p.PED_LAT},${p.PED_LNG}" target="_blank" class="underline text-green-600 text-[11px]">📍 Ver destino (pedido)</a>`:'<span class="text-[10px] text-slate-400">Sin GPS</span>');
      return `<tr class="border-b hover:bg-[#F8F5F5]">
        <td class="px-3 py-2 font-bold">#${p.NUM_PED}</td>
        <td class="px-3 py-2">${cliente}</td>
        <td class="px-3 py-2 font-bold text-[#0F5C4A]">$${total}</td>
        <td class="px-3 py-2 max-w-[180px]">${dir}</td>
        <td class="px-3 py-2">${origen}</td>
        <td class="px-3 py-2">${destino}</td>
        <td class="px-3 py-2"><span class="px-2 py-1 rounded-full text-[10px] font-bold ${estColor}">${estatus}</span></td>
        <td class="px-3 py-2"><button onclick="verPedido(${p.NUM_PED})" class="bg-black text-white px-3 py-1 rounded-full text-[11px]">Ver</button></td>
      </tr>`;
    }).join('');

    if(movil){
      movil.innerHTML=r.map(p=>{
        const total=((p.SUB_TOT||0)+(p.IVA_TOT||0)).toFixed(2);
        return `<div class="bg-white rounded-xl border p-3 mb-2"><div class="flex justify-between"><b>#${p.NUM_PED} ${p.DES_CTE}</b><span class="bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded-full text-[10px] font-bold">${p.STA_PED||'P'}</span></div><div class="text-[11px] mt-1">$${total} - ${p.DIRECCION||''}</div><div class="flex gap-2 mt-2"><a href="https://www.google.com/maps?q=${p.PED_LAT},${p.PED_LNG}" target="_blank" class="text-[11px] underline text-blue-600">Origen</a><a href="https://www.google.com/maps?q=${p.LAT||p.PED_LAT},${p.LNG||p.PED_LNG}" target="_blank" class="text-[11px] underline text-green-600">Destino</a><button onclick="verPedido(${p.NUM_PED})" class="ml-auto bg-black text-white px-3 py-1 rounded-full text-[11px]">Ver detalle</button></div></div>`;
      }).join('');
    }

  }catch(e){
    tbody.innerHTML=`<tr><td colspan=8 class="px-3 py-4 text-red-500">Error: ${e.message}</td></tr>`;
  }
}

async function verPedido(folio){
  document.getElementById('detalle-folio').innerText='#'+folio;
  const cont=document.getElementById('pedido-detalle-cont');
  cont.innerHTML='Cargando...';
  document.getElementById('pedido-detalle').classList.remove('hidden');
  try{
    const r=await fetch('/api/admin/pedido/'+folio).then(r=>r.json());
    const h=r.header; const d=r.detail;
    cont.innerHTML=`
      <div class="bg-[#F8F5F5] rounded-xl p-3">
        <b>Cliente:</b> ${h?.DES_CTE} (${h?.CVE_CTE})<br>
        <b>Dir:</b> ${h?.DIRECCION||'N/A'}<br>
        <b>Estatus:</b> ${h?.STA_PED||'P'}<br>
        <b>Fecha:</b> ${new Date(h?.FEC_PED).toLocaleString()}<br>
        <div class="flex gap-2 mt-2">
          ${h?.PED_LAT?`<a href="https://www.google.com/maps?q=${h.PED_LAT},${h.PED_LNG}" target="_blank" class="bg-blue-600 text-white px-3 py-1 rounded-full text-[11px]">📍 Origen</a>`:''}
          ${h?.LAT?`<a href="https://www.google.com/maps?q=${h.LAT},${h.LNG}" target="_blank" class="bg-green-600 text-white px-3 py-1 rounded-full text-[11px]">📍 Destino</a>`:''}
          ${!h?.LAT && h?.PED_LAT?`<a href="https://www.google.com/maps?q=${h.PED_LAT},${h.PED_LNG}" target="_blank" class="bg-green-600 text-white px-3 py-1 rounded-full text-[11px]">📍 Destino (pedido)</a>`:''}
        </div>
      </div>
      <hr class="my-3">
      <b>Productos:</b><br>
      <div class="mt-2">${d.map(x=>`<div class="flex justify-between border-b py-1"><span>${x.CAN_PRO} x ${x.nombre||x.CVE_PRO}</span><span>$${Number(x.PRE_PRO).toFixed(2)}</span></div>`).join('')}</div>
      <hr class="my-3"><div class="text-right font-bold text-[14px]">Total: $${((h?.SUB_TOT||0)+(h?.IVA_TOT||0)).toFixed(2)}</div>
    `;
  }catch(e){ cont.innerHTML='Error: '+e.message; }
}
</script>
