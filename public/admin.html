<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Boutique B&G V43</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>*{font-family:Inter,sans-serif}</style>
</head>
<body class="bg-[#F8F5F5]">
<div class="max-w-[1200px] mx-auto p-4">
<h1 class="font-bold text-[22px]">Productos - Subir Fotos V43</h1>
<div class="bg-green-50 border border-green-200 rounded-xl px-4 py-2 mt-2 text-[12px]">💡 La foto se guarda como <b>/img/CVE.jpg</b> - FIX V43 volumen persistente - <a href="/api/debug/img" target="_blank" class="underline text-green-700">Ver fotos guardadas (/api/debug/img)</a></div>

<div class="bg-white rounded-xl p-3 mt-3 flex gap-2">
<input id="buscador" placeholder="Buscar..." class="flex-1 bg-[#F8F5F5] rounded-full px-4 py-2 text-[13px] outline-none">
<button onclick="cargar()" class="bg-black text-white px-4 py-2 rounded-full text-[12px]">Recargar</button>
</div>

<div id="productos" class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-4">Cargando...</div>
</div>

<script>
let todos=[];
async function cargar(){
  const r = await fetch('/api/productos').then(r=>r.json());
  todos=r;
  render(r);
}
function render(lista){
  const div=document.getElementById('productos');
  div.innerHTML='';
  const q=document.getElementById('buscador').value.toLowerCase();
  const f=lista.filter(p=>p.cve.toLowerCase().includes(q)||p.nombre.toLowerCase().includes(q));
  f.forEach(p=>{
    const cveLimpio = (p.cve||'').trim().toUpperCase().replace(/\s+/g,'');
    const el=document.createElement('div');
    el.className="bg-white rounded-xl border p-2";
    el.innerHTML=`
      <div class="h-[120px] bg-[#F8F5F5] rounded-lg overflow-hidden grid place-items-center">
        <img src="/img/${encodeURIComponent(cveLimpio)}.jpg?t=${Date.now()}" class="w-full h-full object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='grid'">
        <div class="hidden w-full h-full place-items-center text-[10px] text-slate-400">Sin foto<br>${cveLimpio}.jpg</div>
      </div>
      <div class="text-[11px] font-semibold mt-2 h-[32px] overflow-hidden leading-tight">${p.nombre}</div>
      <div class="text-[10px] text-slate-400">${p.cve}</div>
      <div class="text-[#0F5C4A] font-bold text-[13px]">$${Number(p.precio).toFixed(2)}</div>
      <label class="mt-2 w-full bg-[#0E0E0E] text-white py-2 rounded-full text-[11px] font-bold grid place-items-center cursor-pointer">
        📷 Subir Foto
        <input type="file" accept="image/*" class="hidden" onchange="subirFoto(this,'${p.cve}')">
      </label>
      <div class="status text-[10px] text-center mt-1"></div>
    `;
    div.appendChild(el);
  });
}

async function subirFoto(input, cve){
  const file=input.files[0];
  if(!file) return;
  const cveLimpio = cve.trim().toUpperCase().replace(/\s+/g,'').replace(/[^A-Z0-9\-_]/g,'').substring(0,30);
  const status = input.closest('div').parentElement.querySelector('.status');
  status.innerText='Subiendo...';
  const fd=new FormData();
  fd.append('imagen', file);
  fd.append('cve', cveLimpio);

  try{
    // intenta las 2 rutas por compatibilidad
    let res = await fetch('/api/upload/producto', {method:'POST', body: fd});
    if(!res.ok){
      const fd2=new FormData();
      fd2.append('imagen', file);
      fd2.append('cve', cveLimpio);
      res = await fetch('/api/upload-imagen', {method:'POST', body: fd2});
    }
    const j=await res.json();
    console.log('Upload resp:', j);
    if(j.ok){
      status.innerText='✅ Guardado! Recargando...';
      // verifica que exista
      setTimeout(()=>cargar(), 800);
    }else{
      status.innerText='❌ '+(j.error||'Error');
    }
  }catch(e){
    status.innerText='❌ '+e.message;
  }
}

document.getElementById('buscador').addEventListener('input', ()=>render(todos));
cargar();
</script>
</body>
</html>
