<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIENDA WEB - SYSPTV</title>
<style>
body{margin:0;font-family:Arial;background:#f5f5f5}
header{background:#000;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;text-decoration:none;background:#222;padding:6px 12px;border-radius:6px;margin-left:8px}
.container{display:flex;gap:15px;padding:15px}
.productos{flex:3;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:#fff;padding:12px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.card b{font-size:13px;display:block;min-height:30px}
.btn{width:100%;background:#000;color:#fff;border:0;padding:8px;border-radius:6px;margin-top:8px;cursor:pointer}
.pedido{flex:1;background:#fff;padding:15px;border-radius:8px;height:fit-content;position:sticky;top:10px}
.pedido input,.pedido select{width:100%;padding:8px;margin:6px 0;border:1px solid #ccc;border-radius:6px}
.btnEnviar{width:100%;background:#000;color:#fff;padding:12px;border:0;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px}
</style>
</head>
<body>
<header>
  <div><b>TIENDA WEB - SYSPTV</b></div>
  <div id="authBtns">
    <a href="/login.html" id="btnLogin">Iniciar Sesión</a>
    <a href="/registro.html" id="btnRegistro">Registrarse</a>
    <a href="/admin.html" id="btnAdmin" style="display:none;">Admin</a>
    <button id="btnLogout" style="display:none; background:#fff; color:#000; border:0; padding:6px 12px; border-radius:6px; cursor:pointer;" onclick="logout()">Salir</button>
  </div>
</header>

<div class="container">
  <div class="productos" id="productos"></div>
  <div class="pedido">
    <b>Tu Pedido</b>
    <p>Total: $<span id="total">0</span></p>
    <div id="listaCarrito" style="font-size:13px;"></div>
    <hr>
    <b>Datos de Entrega</b>
    <input id="nombre" placeholder="Nombre">
    <input id="tel" placeholder="Tel / WhatsApp">
    <input id="calle" placeholder="Calle y Número">
    <input id="colonia" placeholder="Colonia">
    <input id="ciudad" placeholder="Ciudad">
    <select id="pago"><option>EFECTIVO</option><option>TRANSFERENCIA</option></select>
    <div style="background:#eef6ff; padding:8px; font-size:12px; margin-top:8px;">
      📍 <span id="ubi">Ubicación: obteniendo...</span> <a href="#" onclick="getUbi()">Capturar mi ubicación GPS</a>
    </div>
    <button class="btnEnviar" onclick="enviarPedido()">ENVIAR PEDIDO</button>
  </div>
</div>

<script>
let carrito=[]; let total=0; let ubiTxt="";
function getUbi(){
  navigator.geolocation.getCurrentPosition(p=>{
    ubiTxt = p.coords.latitude+','+p.coords.longitude;
    document.getElementById('ubi').innerText='Ubicación: '+ubiTxt;
  });
}
getUbi();

fetch('/api/productos').then(r=>r.json()).then(data=>{
  const cont=document.getElementById('productos');
  cont.innerHTML='';
  data.forEach(p=>{
    cont.innerHTML+=`<div class="card"><b>${p.Nombre||p.nombre}</b><small>${p.Codigo||''}</small><br><b>$${p.Precio||0}</b><button class="btn" onclick="agregar('${p.Nombre}',${p.Precio})">+ Agregar</button></div>`;
  });
});

function agregar(nombre,precio){
  carrito.push({nombre,precio});
  total+=Number(precio);
  document.getElementById('total').innerText=total;
  document.getElementById('listaCarrito').innerHTML+=`<div>${nombre} - $${precio}</div>`;
}
function enviarPedido(){
  fetch('/api/pedidos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre:document.getElementById('nombre').value,telefono:document.getElementById('tel').value,calle:document.getElementById('calle').value,colonia:document.getElementById('colonia').value,ciudad:document.getElementById('ciudad').value,pago:document.getElementById('pago').value,ubicacion:ubiTxt,carrito,total})}).then(r=>r.json()).then(d=>{alert('Pedido enviado!'); location.reload()});
}

// LOGIN CHECK - OCULTA ADMIN
fetch('/api/me').then(r=>{
  if(!r.ok) throw 0;
  return r.json()
}).then(u=>{
  if(u.rol==='admin'){
    document.getElementById('btnAdmin').style.display='inline-block';
    document.getElementById('btnLogout').style.display='inline-block';
    document.getElementById('btnLogin').style.display='none';
    document.getElementById('btnRegistro').style.display='none';
  } else if(u.rol==='cliente'){
    document.getElementById('btnLogout').style.display='inline-block';
    document.getElementById('btnLogin').style.display='none';
    document.getElementById('btnRegistro').style.display='none';
  }
}).catch(()=>{});

function logout(){ fetch('/api/logout',{method:'POST'}).then(()=>location.reload()) }
</script>
</body>
</html>
