<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boutique B&G - Barrio Elegancia</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FFF8F9] text-slate-900">
<header class="sticky top-0 z-40 bg-[#0E0E0E] text-[#F5E6C8] px-4 py-3.5 flex justify-between items-center">
<b id="nombre-tienda" style="font-family:'Playfair Display'" class="text-[22px]">Boutique B&G</b>
<div class="flex gap-2 items-center">
<span id="user-label" class="hidden text-[11px]"></span>
<button id="btn-login-header" onclick="abrirLogin()" class="bg-white text-black px-4 py-1.5 rounded-full text-[12px] font-bold">Iniciar</button>
<span id="logout" onclick="logout()" class="hidden text-[11px] underline">Salir</span>
<div class="bg-white text-black w-9 h-9 grid place-items-center rounded-full">🛒<span id="count" class="absolute -top-1 -right-1 bg-[#0F5C4A] text-white text-[10px] min-w-[18px] h-[18px] grid place-items-center rounded-full">0</span></div>
</div>
</header>
<div class="max-w-[1300px] mx-auto px-4 pt-4">
<div class="bg-white rounded-[24px] p-3 shadow"><div class="relative"><span class="absolute left-4 top-3.5 opacity-40">🔍</span><input id="buscador" class="w-full bg-[#F8F5F5] rounded-full py-3.5 pl-11 pr-4 text-[14px] outline-none" placeholder="Buscar ropa, accesorios, estilo..."></div><div class="flex gap-2 mt-3 overflow-auto"><button class="bg-[#0F5C4A] text-white px-4 py-2 rounded-full text-[13px]">✨ Todo</button><button class="bg-white border px-4 py-2 rounded-full text-[13px]">Nuevo</button><button class="bg-white border px-4 py-2 rounded-full text-[13px]">Vestidos</button><button class="bg-[#FFE4E8] px-4 py-2 rounded-full text-[13px]">Sale</button></div></div>
<div id="banners" class="mt-4 hidden"><div id="banner-inner" class="rounded-[22px] h-[150px] flex overflow-x-auto"></div><div id="banner-dots" class="flex justify-center gap-1.5 mt-2"></div></div>
</div>
<div class="max-w-[1300px] mx-auto px-4 py-5 grid lg:grid-cols-[1fr_380px] gap-5"><div><h2 class="font-bold mb-3">Productos Destacados</h2><div id="productos" class="grid grid-cols-2 md:grid-cols-3 gap-3">Cargando...</div></div><div class="lg:sticky top-[76px] h-fit"><div class="bg-white rounded-[24px] p-5 shadow"><h3 class="font-bold">🛍️ Tu Pedido</h3><div id="carrito-lista" class="max-h-[260px] overflow-auto my-3 text-[13px]"></div><div id="total" class="font-extrabold text-[20px] border-t pt-3">Total: $0.00</div><input id="nombre" class="w-full bg-[#F8F5F5] rounded-xl px-4 py-3 mt-3 text-[13px]" placeholder="Nombre *"><input id="telefono" class="w-full bg-[#F8F5F5] rounded-xl px-4 py-3 mt-2 text-[13px]" placeholder="WhatsApp *"><input id="direccion" class="w-full bg-[#F8F5F5] rounded-xl px-4 py-3 mt-2 text-[13px]" placeholder="Dirección *"><button onclick="obtenerUbicacion()" class="w-full bg-[#F1F5F9] border border-dashed border-[#0F5C4A]/40 text-[#0F5C4A] py-3 rounded-xl text-[13px] mt-2">📍 GPS Pedido</button><div id="loc-status" class="text-[11px] text-slate-500">Sin ubicación</div><button id="btn-pedido" onclick="hacerPedido()" class="w-full bg-[#0E0E0E] text-white py-4 rounded-full font-bold mt-3">HACER PEDIDO ✨</button><p id="msg" class="text-[12px] text-center mt-2"></p></div></div></div>
<div id="login-modal" onclick="if(event.target==this) cerrarLogin()" class="fixed inset-0 bg-black/60 z-[999] hidden items-center justify-center p-4"><div class="bg-white w-full max-w-[380px] rounded-[28px] p-6 relative"><span onclick="cerrarLogin()" class="absolute right-5 top-4 w-8 h-8 grid place-items-center bg-black/5 rounded-full cursor-pointer">✕</span><h3 id="login-title" class="font-bold text-[20px]">Iniciar Sesión</h3><input id="l-tel" class="w-full bg-[#F8F5F5] rounded-xl px-4 py-3 mt-4" placeholder="WhatsApp"><input id="l-pass" class="w-full bg-[#F8F5F5] rounded-xl px-4 py-3 mt-2" type="password" placeholder="Contraseña"><input id="l-nom" class="hidden w-full bg-[#F8F5F5] rounded-xl px-4 py-3 mt-2" placeholder="Nombre completo"><input id="l-dir" class="hidden w-full bg-[#F8F5F5] rounded-xl px-4 py-3 mt-2" placeholder="Dirección"><button class="w-full bg-black text-white py-3 rounded-full mt-3" onclick="doLogin()">Entrar</button><button id="btn-reg" class="hidden w-full bg-[#FFE4E8] py-3 rounded-full mt-2" onclick="doRegistro()">Crear cuenta</button><p id="toggle-text" class="text-[12px] text-center mt-3 underline cursor-pointer" onclick="toggleModo()">¿No tienes cuenta? Regístrate</p><p id="login-msg" class="text-[12px] text-center mt-2"></p></div></div>
<script>
let todos=[], carrito=[], myLat=null, myLng=null, modoRegistro=false;
let clienteActual = JSON.parse(localStorage.getItem('cliente_v2')||sessionStorage.getItem('cliente_v2')||'null');
function abrirLogin(){ document.getElementById('login-modal').style.display='flex'; }
function cerrarLogin(){ document.getElementById('login-modal').style.display='none'; }
function checkAuth(){ if(clienteActual && clienteActual.CVE_CTE!=='ADMIN'){ document.getElementById('user-label').innerText=clienteActual.DES_CTE||''; document.getElementById('user-label').classList.remove('hidden'); document.getElementById('nombre').value=clienteActual.DES_CTE||''; document.getElementById('telefono').value=clienteActual.CVE_CTE||''; document.getElementById('direccion').value=clienteActual.DIRECCION||''; document.getElementById('btn-login-header').style.display='none'; document.getElementById('logout').style.display='inline'; document.getElementById('logout').classList.remove('hidden'); } else { if(clienteActual && clienteActual.CVE_CTE==='ADMIN'){ localStorage.removeItem('cliente_v2'); sessionStorage.removeItem('cliente_v2'); clienteActual=null; } } }
function toggleModo(){ modoRegistro=!modoRegistro; document.getElementById('l-nom').classList.toggle('hidden',!modoRegistro); document.getElementById('l-dir').classList.toggle('hidden',!modoRegistro); document.getElementById('btn-reg').classList.toggle('hidden',!modoRegistro); }
function enterLogin(){ if(modoRegistro) doRegistro(); else doLogin(); }
async function doLogin(){ const tel=document.getElementById('l-tel').value.trim(); const pass=document.getElementById('l-pass').value.trim(); const r=await fetch('/api/cliente/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({telefono:tel,password:pass})}).then(r=>r.json().then(j=>({status:r.status, body:j}))); if(r.body.ok){ if(r.body.esAdmin){ sessionStorage.setItem('admin_ok','1'); window.location.href='/admin.html'; return; } localStorage.setItem('cliente_v2', JSON.stringify(r.body.cliente)); sessionStorage.setItem('cliente_v2', JSON.stringify(r.body.cliente)); location.reload(); } else { document.getElementById('login-msg').innerText='❌ '+(r.body.error||'Error'); } }
async function doRegistro(){ const r=await fetch('/api/cliente/registro',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre:document.getElementById('l-nom').value, telefono:document.getElementById('l-tel').value, password:document.getElementById('l-pass').value, direccion:document.getElementById('l-dir').value})}).then(r=>r.json()); if
