<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boutique B&G - V43 Final</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>*{font-family:Inter,sans-serif}.no-scrollbar::-webkit-scrollbar{display:none}</style>
</head>
<body class="bg-[#F8F9FA]">
<header class="sticky top-0 z-40 bg-[#0E0E0E] text-[#F5E6C8] px-4 py-3.5 flex justify-between items-center shadow-md">
<b id="nombre-tienda" style="font-family:'Playfair Display'" class="text-[22px] tracking-wide">Boutique B&G</b>
<div class="flex gap-2 items-center">
<span id="user-label" class="hidden text-[12px] text-white/80 font-medium"></span>
<button id="btn-login-header" onclick="abrirLogin()" class="bg-white text-black px-4 py-1.5 rounded-full text-[12px] font-bold transition hover:bg-gray-100">Iniciar</button>
<span id="logout" onclick="logout()" class="hidden text-[11px] text-white/70 underline cursor-pointer">Salir</span>
<div class="relative bg-white text-black w-9 h-9 grid place-items-center rounded-full shadow-inner">🛒<span id="count" class="absolute -top-1 -right-1 bg-[#0F5C4A] text-white text-[10px] min-w-[18px] h-[18px] grid place-items-center rounded-full font-bold">0</span></div>
</div>
</header>

<div class="max-w-[1300px] mx-auto px-4 pt-4">
<div class="bg-white rounded-[24px] p-3.5 shadow-sm border border-black/5">
<div class="relative"><span class="absolute left-4 top-3.5 opacity-40">🔍</span><input id="buscador" class="w-full bg-[#F3F4F6] rounded-full py-3 pl-11 pr-4 text-[14px] outline-none transition focus:bg-white focus:ring-2 focus:ring-black/10" placeholder="Buscar productos, estilo, accesorios..."></div>
<div class="flex gap-2 mt-3 overflow-auto no-scrollbar"><button class="shrink-0 bg-[#0F5C4A] text-white px-4 py-2 rounded-full text-[13px] font-medium shadow-sm">✨ Todo</button><button class="shrink-0 bg-white border border-gray-200 text-gray-700 px-4 py-2 rounded-full text-[13px] font-medium hover:bg-gray-50">Nuevo</button><button class="shrink-0 bg-white border border-gray-200 text-gray-700 px-4 py-2 rounded-full text-[13px] font-medium hover:bg-gray-50">Vestidos</button><button class="shrink-0 bg-[#FFE4E8] text-[#9b1c2e] border border-[#ffccd5] px-4 py-2 rounded-full text-[13px] font-semibold">Sale</button></div>
</div>

<!-- BANNER V42 - AJUSTADO AUTOMATICO SIN CORTES -->
<div id="banners" class="mt-4 hidden">
  <div id="banner-inner" class="relative rounded-[24px] overflow-hidden bg-white shadow-[0_12px_30px_rgba(0,0,0,.08)] w-full"></div>
  <div id="banner-dots" class="flex justify-center gap-2 mt-3"></div>
</div>

</div>

<div class="max-w-[1300px] mx-auto px-4 py-5 grid lg:grid-cols-[1fr_380px] gap-6">
<div><div class="flex justify-between items-center mb-4"><h2 class="font-bold text-[19px] text-gray-900">Productos Destacados</h2><span id="prod-count" class="text-[12px] font-medium text-slate-400"></span></div><div id="productos" class="grid grid-cols-2 md:grid-cols-3 gap-4">Cargando...</div></div>
<div class="lg:sticky lg:top-[76px] h-fit"><div class="bg-white rounded-[24px] p-5 shadow-sm border border-black/5"><h3 class="font-bold text-[16px] mb-1">🛍️ Tu Pedido</h3><div id="carrito-lista" class="max-h-[260px] overflow-auto my-3 text-[13px] divide-y divide-gray-100"><small class="text-slate-400">Carrito vacío</small></div><div id="total" class="font-extrabold text-[20px] border-t pt-3 text-gray-900">Total: $0.00</div><input id="nombre" class="w-full bg-[#F3F4F6] rounded-xl px-4 py-3 mt-3 text-[13px] outline-none" placeholder="Nombre *"><input id="telefono" class="w-full bg-[#F3F4F6] rounded-xl px-4 py-3 mt-2 text-[13px] outline-none" placeholder="WhatsApp *"><input id="direccion" class="w-full bg-[#F3F4F6] rounded-xl px-4 py-3 mt-2 text-[13px] outline-none" placeholder="Dirección *"><button onclick="obtenerUbicacion()" class="w-full bg-[#F8FAFC] border border-dashed border-[#0F5C4A]/40 text-[#0F5C4A] py-3 rounded-xl text-[13px] font-semibold mt-2 hover:bg-[#F1F5F9] transition">📍 GPS Pedido</button><div id="loc-status" class="text-[11px] text-slate-500 mt-1">Sin ubicación</div><button id="btn-pedido" onclick="hacerPedido()" class="w-full bg-[#0E0E0E] hover:bg-black text-white py-4 rounded-full font-bold mt-4 shadow-md transition">HACER PEDIDO ✨</button><p id="msg" class="text-[12px] text-center mt-2 font-medium"></p></div></div>
</div>

<div id="login-modal" onclick="if(event.target==this) cerrarLogin()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[999] hidden items-center justify-center p-4"><div class="bg-white w-full max-w-[380px] rounded-[28px] p-6 relative shadow-2xl"><span onclick="cerrarLogin()" class="absolute right-5 top-4 w-8 h-8 grid place-items-center bg-black/5 rounded-full cursor-pointer hover:bg-black/10 transition">✕</span><h3 id="login-title" class="font-bold text-[20px]">Iniciar Sesión</h3><input id="l-tel" class="w-full bg-[#F3F4F6] rounded-xl px-4 py-3 mt-4 outline-none" placeholder="WhatsApp o admin" onkeydown="if(event.key==='Enter') enterLogin()"><input id="l-pass" class="w-full bg-[#F3F4F6] rounded-xl px-4 py-3 mt-2 outline-none" type="password" placeholder="Contraseña" onkeydown="if(event.key==='Enter') enterLogin()"><input id="l-nom" class="hidden w-full bg-[#F3F4F6] rounded-xl px-4 py-3 mt-2 outline-none" placeholder="Nombre completo"><input id="l-dir" class="hidden w-full bg-[#F3F4F6] rounded-xl px-4 py-3 mt-2 outline-none" placeholder="Dirección"><button class="w-full bg-[#0E0E0E] text-white py-3.5 rounded-full font-bold mt-4 shadow-md" onclick="doLogin()">Entrar</button><button id="btn-reg" class="hidden w-full bg-[#FFE4E8] text-black py-3.5 rounded-full font-bold mt-2" onclick="doRegistro()">Crear cuenta</button><p id="toggle-text" class="text-[12px] text-center mt-4 underline cursor-pointer text-gray-600" onclick="toggleModo()">¿No tienes cuenta? Regístrate</p><p id="login-msg" class="text-[12px] text-center mt-2 text-red-500"></p></div></div>

<script>
let todos=[], carrito=[], myLat=null, myLng=null, modoRegistro=false;
let clienteActual = JSON.parse(localStorage.getItem('cliente_v2')||sessionStorage.getItem('cliente_v2')||'null');
function abrirLogin(){ document.getElementById('login-modal').style.display='flex'; }
function cerrarLogin(){ document.getElementById('login-modal').style.display='none'; }
function checkAuth(){
  if(clienteActual && clienteActual.CVE_CTE!=='ADMIN'){
    document.getElementById('user-label').innerText=clienteActual.DES_CTE||'';
    document.getElementById('user-label').classList.remove('hidden');
    document.getElementById('nombre').value=clienteActual.DES_CTE||'';
    document.getElementById('telefono').value=clienteActual.CVE_CTE||'';
    document.getElementById('direccion').value=clienteActual.DIRECCION||'';
    document.getElementById('btn-login-header').style.display='none';
    document.getElementById('logout').style.display='inline';
    document.getElementById('logout').classList.remove('hidden');
  }
}
function toggleModo(){ modoRegistro=!modoRegistro; document.getElementById('l-nom').classList.toggle('hidden',!modoRegistro); document.getElementById('l-dir').classList.toggle('hidden',!modoRegistro); document.getElementById('btn-reg').classList.toggle('hidden',!modoRegistro); document.getElementById('login-title').innerText=modoRegistro?'Crear cuenta':'Iniciar Sesión'; }
function enterLogin(){ if(modoRegistro) doRegistro(); else doLogin(); }
async function doLogin(){
  const tel=document.getElementById('l-tel').value.trim(); const pass=document.getElementById('l-pass').value.trim();
  if(!tel||!pass) return alert('Falta usuario');
  const r=await fetch('/api/cliente/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({telefono:tel,password:pass})}).then(r=>r.json().then(j=>({status:r.status, body:j})));
  if(r.body.ok){ if(r.body.esAdmin){ sessionStorage.setItem('admin_ok','1'); window.location.href='/admin.html'; return; } localStorage.setItem('cliente_v2', JSON.stringify(r.body.cliente)); sessionStorage.setItem('cliente_v2', JSON.stringify(r.body.cliente)); location.reload(); } else { document.getElementById('login-msg').innerText='❌ '+(r.body.error||'Error'); }
}
async function doRegistro(){ const r=await fetch('/api/cliente/registro',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre:document.getElementById('l-nom').value, telefono:document.getElementById('l-tel').value, password:document.getElementById('l-pass').value, direccion:document.getElementById('l-dir').value})}).then(r=>r.json()); if(r.ok){ alert('Registrado! Ahora entra'); toggleModo(); } else alert(r.error); }
function logout(){ localStorage.removeItem('cliente_v2'); sessionStorage.removeItem('cliente_v2'); location.reload(); }

let bannerInterval=null;
let currentBanner=0;
function goSlide(n){
  const slides=document.querySelectorAll('#banner-inner.banner-slide');
  const dots=document.querySelectorAll('#banner-dots.banner-dot');
  if(!slides.length) return;
  slides.forEach(s=>{s.style.opacity='0'; s.style.zIndex='1'});
  dots.forEach(d=>{d.classList.remove('bg-[#0F5C4A]','w-6'); d.classList.add('bg-slate-300','w-2')});
  slides[n].style.opacity='1'; slides[n].style.zIndex='2';
  if(dots[n]){ dots[n].classList.remove('bg-slate-300','w-2'); dots[n].classList.add('bg-[#0F5C4A]','w-6'); }
  currentBanner=n;
}
async function loadBanners(){
  try{
    const b=await fetch('/api/banners').then(r=>r.json());
    if(!b.length) return;
    document.getElementById('banners').classList.remove('hidden');
    const inner=document.getElementById('banner-inner');
    const dots=document.getElementById('banner-dots');
    inner.innerHTML=b.map((x,i)=>`
      <div class="banner-slide absolute ${i===0?'relative':''} inset-0 w-full transition-opacity duration-700 ${i===0?'opacity-100 z-[2]':'opacity-0 z-[1]'}">
        <img src="${x.IMAGEN}?t=${Date.now()}" class="w-full h-auto object-contain block rounded-[24px]" alt="banner">
      </div>
    `).join('');
    dots.innerHTML=b.map((_,i)=>`<div class="banner-dot h-2 rounded-full cursor-pointer transition-all ${i===0?'bg-[#0F5C4A] w-6':'bg-slate-300 w-2'}" onclick="goSlide(${i})"></div>`).join('');
    if(bannerInterval) clearInterval(bannerInterval);
    if(b.length>1){
      bannerInterval=setInterval(()=>{ const next=(currentBanner+1)%b.length; goSlide(next); }, 4500);
    }
  }catch(e){ console.log('banner err',e) }
}

async function init(){
  checkAuth(); loadBanners();
  try{ document.getElementById('nombre-tienda').innerText='Boutique B&G'; }catch{}
  try{
    const res=await fetch('/api/productos');
    todos=await res.json();
    document.getElementById('prod-count').innerText = todos.length + ' productos';
    renderProductos(todos);
  }catch(e){
    document.getElementById('productos').innerHTML = 'Error cargando: '+e.message;
  }
}

// Función para alternar entre miniaturas de imágenes múltiples por producto
function cambiarImagenProd(cveClean, urlImg) {
  const imgElem = document.getElementById(`img-prod-${cveClean}`);
  if(imgElem && urlImg) {
    imgElem.src = urlImg;
  }
}

// Función auxiliar de respaldo para manejar extensiones .jpg o .JPG automáticamente
function handleImgError(imgElement, originalUrl) {
  if (!imgElement.dataset.retried) {
    imgElement.dataset.retried = "true";
    if (originalUrl.includes('.jpg')) {
      imgElement.src = originalUrl.replace('.jpg', '.JPG');
      return;
    } else if (originalUrl.includes('.JPG')) {
      imgElement.src = originalUrl.replace('.JPG', '.jpg');
      return;
    }
  }
  imgElement.src = '/img/default.jpg';
}

function renderProductos(lista){
  const div=document.getElementById('productos');
  div.innerHTML='';
  if(!lista.length){ div.innerHTML='<div class=text-slate-400>Sin productos</div>'; return; }
  const frag=document.createDocumentFragment();
  lista.slice(0,120).forEach(p=>{
    const cveRaw=(p.cve||'').trim();
    const cveUpper=cveRaw.toUpperCase().replace(/\s+/g,'');
    
    const pre = Math.round(Number(p.precio || 0));
    const existencia = Number(p.existencia || 0);
    
    const el=document.createElement('div');
    el.className="bg-white rounded-[22px] overflow-hidden border border-gray-100 shadow-[0_4px_20px_rgba(0,0,0,0.04)] flex flex-col justify-between transition-all duration-300 hover:shadow-[0_8px_25px_rgba(0,0,0,0.08)] hover:-translate-y-0.5";
    
    const img1 = p.imagen || `/img/${encodeURIComponent(cveUpper)}.jpg`;
    const img2 = p.imagen2 || null;
    const img3 = p.imagen3 || null;

    const tag = pre > 800 ? 'Premium' : 'Nuevo';
    const tagClass = pre > 800 ? 'bg-[#FFE4E8] text-[#9b1c2e]' : 'bg-black text-white';

    let miniaturasHtml = '';
    if(img2 || img3) {
      miniaturasHtml = `<div class="flex gap-1.5 mt-2.5 justify-center items-center">
        <button onclick="cambiarImagenProd('${cveUpper}', '${img1}')" class="w-7 h-7 rounded-lg border border-gray-200 overflow-hidden focus:ring-2 focus:ring-black/20 transition hover:scale-105"><img src="${img1}" class="w-full h-full object-cover" onerror="handleImgError(this, '${img1}')"></button>
        ${img2 ? `<button onclick="cambiarImagenProd('${cveUpper}', '${img2}')" class="w-7 h-7 rounded-lg border border-gray-200 overflow-hidden focus:ring-2 focus:ring-black/20 transition hover:scale-105"><img src="${img2}" class="w-full h-full object-cover" onerror="handleImgError(this, '${img2}')"></button>` : ''}
        ${img3 ? `<button onclick="cambiarImagenProd('${cveUpper}', '${img3}')" class="w-7 h-7 rounded-lg border border-gray-200 overflow-hidden focus:ring-2 focus:ring-black/20 transition hover:scale-105"><img src="${img3}" class="w-full h-full object-cover" onerror="handleImgError(this, '${img3}')"></button>` : ''}
      </div>`;
    }

    el.innerHTML=`
      <div>
        <div class="h-[170px] bg-[#F8F9FA] flex items-center justify-center overflow-hidden relative group">
          <img id="img-prod-${cveUpper}" src="${img1}" loading="lazy" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" onerror="handleImgError(this, '${img1}')">
          <span class="absolute top-2.5 left-2.5 text-[10px] px-2.5 py-1 rounded-full font-bold uppercase tracking-wider shadow-sm ${tagClass}">${tag}</span>
        </div>
        <div class="product-content p-3.5">
          <div class="text-[13px] font-semibold text-gray-800 leading-snug h-[38px] overflow-hidden">${p.nombre||cveRaw}</div>
          <div class="flex justify-between items-center mt-1 text-[11px] text-gray-400 font-medium">
            <span>Ref: ${cveRaw}</span>
            <span class="bg-gray-100 px-2 py-0.5 rounded-md text-gray-600">Stock: ${existencia}</span>
          </div>
          ${miniaturasHtml}
          <div class="flex justify-between items-center mt-3 pt-2 border-t border-gray-50">
            <div class="text-[#0F5C4A] font-black text-[17px]">$${pre.toLocaleString('es-MX')}</div>
            <div class="text-[#f59e0b] text-[11px]">★★★★★</div>
          </div>
        </div>
      </div>
    `;

    const btn=document.createElement('button');
    btn.className="w-full bg-[#0E0E0E] hover:bg-black text-white py-2.5 rounded-xl text-[12px] font-bold mt-2 shadow-sm transition active:scale-[0.98]";
    btn.innerText="COMPRAR";
    btn.onclick=()=>agregar(cveRaw, p.nombre||cveRaw, pre);
    el.querySelector('.product-content').appendChild(btn);
    frag.appendChild(el);
  });
  div.appendChild(frag);
}

function agregar(articulo,nombre,precio){ let f=carrito.find(x=>x.articulo===articulo); if(f) f.cantidad++; else carrito.push({articulo, nombre, precio:Number(precio), cantidad:1}); renderCarrito(); }
function renderCarrito(){
  const div=document.getElementById('carrito-lista'); let total=0; div.innerHTML='';
  if(carrito.length===0) div.innerHTML='<small class=text-slate-400>Carrito vacío - agrega tu flow</small>';
  carrito.forEach((it,i)=>{
    const sub=it.precio*it.cantidad; total+=sub;
    const row=document.createElement('div'); row.className="flex justify-between items-center py-2.5";
    row.innerHTML=`<div class="flex-1"><div class="font-semibold text-[12.5px] text-gray-800">${it.nombre}</div><div class="text-[10px] text-slate-400">${it.articulo}</div><div class="text-[#0F5C4A] font-bold text-[12px]">$${it.precio.toLocaleString('es-MX')} x ${it.cantidad}</div></div>`;
    const ctrl=document.createElement('div'); ctrl.className="flex items-center gap-1.5";
    ctrl.innerHTML=`<button class="w-7 h-7 rounded-full bg-gray-100 text-gray-700 font-bold hover:bg-gray-200">-</button><b class="text-[12px] w-4 text-center">${it.cantidad}</b><button class="w-7 h-7 rounded-full bg-gray-100 text-gray-700 font-bold hover:bg-gray-200">+</button><span class="cursor-pointer ml-1 text-gray-400 hover:text-red-500">✕</span>`;
    ctrl.children[0].onclick=()=>cambiarCant(i,-1); ctrl.children[2].onclick=()=>cambiarCant(i,1); ctrl.children[3].onclick=()=>{carrito.splice(i,1);renderCarrito()};
    row.appendChild(ctrl); div.appendChild(row);
  });
  document.getElementById('total').innerText=`Total: $${total.toLocaleString('es-MX')}.00`;
  document.getElementById('count').innerText=carrito.reduce((s,p)=>s+p.cantidad,0);
}
function cambiarCant(i,d){ carrito[i].cantidad+=d; if(carrito[i].cantidad<=0) carrito.splice(i,1); renderCarrito(); }
document.getElementById('buscador').addEventListener('input', e=>{ const q=e.target.value.toLowerCase(); const f=todos.filter(p=>(p.nombre||'').toLowerCase().includes(q)||(p.cve||'').toLowerCase().includes(q)); renderProductos(f); });
function obtenerUbicacion(){ const st=document.getElementById('loc-status'); st.innerText='Obteniendo GPS...'; navigator.geolocation.getCurrentPosition(pos=>{ myLat=pos.coords.latitude.toFixed(6); myLng=pos.coords.longitude.toFixed(6); st.innerHTML=`✅ ${myLat}, ${myLng} <a href="https://maps.google.com/?q=${myLat},${myLng}" target="_blank" class="underline">Ver</a>`; }, err=>{ st.innerText='Error GPS: '+err.message; }); }
async function hacerPedido(){
  if(carrito.length===0) return alert('Carrito vacío');
  if(!clienteActual){ abrirLogin(); return alert('Inicia sesión'); }
  const nombre=document.getElementById('nombre').value.trim(); const telefono=document.getElementById('telefono').value.trim(); const direccion=document.getElementById('direccion').value.trim();
  if(!nombre||!telefono||!direccion) return alert('Falta datos');
  document.getElementById('btn-pedido').disabled=true; document.getElementById('msg').innerText='Guardando...';
  try{ const res=await fetch('/api/pedidos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre, telefono, direccion, lat:myLat, lng:myLng, total: carrito.reduce((s,p)=>s+p.precio*p.cantidad,0), productos: carrito.map(p=>({cve:p.articulo, cantidad:p.cantidad, precio:p.precio}))})}); const j=await res.json(); if(j.ok){ document.getElementById('msg').innerHTML=`✅ Pedido #${j.folio} $${j.total.toLocaleString('es-MX')}.00`; carrito=[]; renderCarrito(); } else document.getElementById('msg').innerText='❌ '+j.error; }catch(e){ document.getElementById('msg').innerText='❌ '+e.message; }
  document.getElementById('btn-pedido').disabled=false;
}
init();
</script>
</body>
</html>
