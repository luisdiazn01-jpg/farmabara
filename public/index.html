<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIENDA SYSPTV</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}body{background:#F8FAFC;color:#0F172A}header{background:#0F172A;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}.btn-login{background:#059669;color:#fff;border:0;padding:8px 16px;border-radius:999px;font-weight:700;cursor:pointer}.badge{background:#059669;color:#fff;padding:6px 12px;border-radius:999px;font-weight:800}.wrap{max-width:1300px;margin:auto;display:grid;grid-template-columns:1fr 390px;gap:20px;padding:20px}@media(max-width:950px){.wrap{grid-template-columns:1fr}}.card{background:#fff;border:1px solid #E2E8F0;border-radius:20px;padding:16px;box-shadow:0 10px 30px rgba(15,23,42,.05)}.search{width:100%;padding:14px 16px;border-radius:12px;border:1px solid #E2E8F0;outline:none;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:14px}.prod{border:1px solid #E2E8F0;border-radius:16px;overflow:hidden;background:#fff}.prod.img{width:100%;height:135px;background:#F1F5F9;display:flex;align-items:center;justify-content:center;overflow:hidden}.prod.img img{width:100%;height:100%;object-fit:cover}.prod.info{padding:10px}.prod.nom{font-size:13px;font-weight:600;height:38px;overflow:hidden}.prod.cve{font-size:11px;color:#64748B}.prod.pre{color:#047857;font-weight:800;margin:6px 0}.btn{width:100%;background:#059669;color:#fff;border:0;padding:11px;border-radius:12px;font-weight:700;cursor:pointer}.ipt{width:100%;padding:12px;border:1px solid #E2E8F0;border-radius:12px;margin:6px 0;outline:none}#login-modal{position:fixed;inset:0;background:rgba(15,23,42,.7);z-index:999;display:none;align-items:center;justify-content:center}.loc-btn{background:#F1F5F9;border:1px dashed #059669;color:#047857;padding:10px;border-radius:12px;width:100%;cursor:pointer;font-weight:600;margin:6px 0}.small{font-size:12px;color:#64748B}</style></head><body>
<header><b id="nombre-tienda">TIENDA WEB - SYSPTV</b><div style="display:flex;align-items:center;gap:10px"><span id="user-label" style="font-size:12px"></span><button id="btn-login-header" class="btn-login" onclick="abrirLogin()">Iniciar Sesión</button><span id="logout" style="display:none;cursor:pointer;font-size:12px" onclick="logout()">Salir</span><span>🛒 <span id="count" class="badge">0</span></span></div></header>

<div id="login-modal" onclick="if(event.target==this) cerrarLogin()"><div class="card" style="width:380px;position:relative"><span onclick="cerrarLogin()" style="position:absolute;right:16px;top:12px;cursor:pointer;font-weight:800">✕</span><h3 id="login-title">Iniciar Sesión</h3><br><input id="l-tel" class="ipt" placeholder="WhatsApp o usuario admin"><input id="l-pass" class="ipt" type="password" placeholder="Contraseña"><input id="l-nom" class="ipt" placeholder="Nombre completo" style="display:none"><input id="l-dir" class="ipt" placeholder="Calle, número, colonia" style="display:none"><button class="btn" onclick="doLogin()">Entrar</button><button class="btn" id="btn-reg" style="background:#0F172A;margin-top:8px;display:none" onclick="doRegistro()">Crear cuenta</button><p class="small" style="margin-top:12px;cursor:pointer;text-align:center" onclick="toggleModo()" id="toggle-text">¿No tienes cuenta? Regístrate aquí</p><p id="login-msg" class="small" style="color:#059669;margin-top:8px"></p></div></div>

<div class="wrap"><div><div class="card"><input id="buscador" class="search" placeholder="Buscar producto por nombre o código..."><div id="productos" class="grid">Cargando...</div></div></div><div><div class="card" style="position:sticky;top:70px"><h3>Tu Pedido</h3><div id="carrito-lista" style="max-height:280px;overflow:auto;margin:10px 0"><small class="small">Carrito vacío</small></div><div id="total" style="font-weight:800;font-size:18px;margin:12px 0">Total: $0.00</div><input id="nombre" class="ipt" placeholder="Nombre completo *"><input id="telefono" class="ipt" placeholder="WhatsApp *"><input id="direccion" class="ipt" placeholder="Calle, número, colonia *"><button class="loc-btn" onclick="obtenerUbicacion()">📍 Obtener mi ubicación GPS</button><div id="loc-status" class="small">Ubicación opcional</div><button id="btn-pedido" class="btn" onclick="hacerPedido()">HACER PEDIDO</button><p id="msg" style="margin-top:10px;font-size:13px;font-weight:600"></p></div></div></div>

<script>
let todos=[], carrito=[], myLat=null, myLng=null, modoRegistro=false;
let clienteActual = JSON.parse(localStorage.getItem('cliente')||'null');

function abrirLogin(){ document.getElementById('login-modal').style.display='flex'; }
function cerrarLogin(){ document.getElementById('login-modal').style.display='none'; }

function checkAuth(){
  if(clienteActual){
    document.getElementById('user-label').innerText=clienteActual.DES_CTE||'';
    document.getElementById('nombre').value=clienteActual.CVE_CTE!=='ADMIN'?clienteActual.DES_CTE||'':'';
    document.getElementById('telefono').value=clienteActual.CVE_CTE!=='ADMIN'?clienteActual.CVE_CTE||'':'';
    document.getElementById('direccion').value=clienteActual.DIRECCION||'';
    document.getElementById('btn-login-header').style.display='none';
    document.getElementById('logout').style.display='inline';
    if(clienteActual.CVE_CTE==='ADMIN'){
      document.getElementById('user-label').innerHTML='ADMIN | <a href="/admin.html" style="color:#10B981">Ir a Panel</a>';
    }
  } else {
    document.getElementById('btn-login-header').style.display='inline-block';
    document.getElementById('logout').style.display='none';
    document.getElementById('user-label').innerText='';
  }
}
function toggleModo(){ modoRegistro=!modoRegistro; document.getElementById('l-nom').style.display=modoRegistro?'block':'none'; document.getElementById('l-dir').style.display=modoRegistro?'block':'none'; document.getElementById('btn-reg').style.display=modoRegistro?'block':'none'; document.getElementById('login-title').innerText=modoRegistro?'Registro':'Login'; document.getElementById('toggle-text').innerText=modoRegistro?'¿Ya tienes cuenta? Entra':'¿No tienes cuenta? Regístrate'; }
async function doLogin(){
  const tel=document.getElementById('l-tel').value.trim(); const pass=document.getElementById('l-pass').value.trim();
  if(!tel||!pass) return alert('Falta usuario y contraseña');
  const r=await fetch('/api/cliente/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({telefono:tel,password:pass})}).then(r=>r.json().then(j=>({status:r.status, body:j})));
  if(r.body.ok){
    localStorage.setItem('cliente', JSON.stringify(r.body.cliente));
    if(r.body.esAdmin){ window.location.href='/admin.html'; return; }
    location.reload();
  } else { document.getElementById('login-msg').innerText='❌ '+(r.body.error||'Error'); }
}
async function doRegistro(){ const r=await fetch('/api/cliente/registro',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre:document.getElementById('l-nom').value, telefono:document.getElementById('l-tel').value, password:document.getElementById('l-pass').value, direccion:document.getElementById('l-dir').value})}).then(r=>r.json()); if(r.ok){ alert('Registrado! Ahora entra'); toggleModo(); } else alert(r.error); }
function logout(){ localStorage.removeItem('cliente'); location.reload(); }
async function init(){ checkAuth(); try{const cfg=await fetch('/api/config').then(r=>r.json()); if(cfg.NOMBRE_TIENDA) document.getElementById('nombre-tienda').innerText=cfg.NOMBRE_TIENDA;}catch{} const res=await fetch('/api/productos'); todos=await res.json(); renderProductos(todos); }
function renderProductos(lista){ const div=document.getElementById('productos'); div.innerHTML=''; if(!lista.length){ div.innerHTML='Sin productos'; return; } lista.slice(0,200).forEach(p=>{ const cve=(p.cve||'').trim(); const nom=(p.nombre||'').trim().replace(/'/g,""); const pre=Number(p.precio||0); div.innerHTML+=`<div class="prod"><div class="img"><img src="/img/${cve}.jpg" onerror="this.parentElement.innerHTML='<span style=color:#94A3B8;font-size:11px'>${cve}</span>'"></div><div class="info"><div class="nom">${p.nombre}</div><div class="cve">${cve}</div><div class="pre">$${pre.toFixed(2)}</div><button class="btn" onclick="agregar('${cve}','${nom}',${pre})">Agregar</button></div></div>`; }); }
function agregar(articulo,nombre,precio){ let f=carrito.find(x=>x.articulo===articulo); if(f) f.cantidad++; else carrito.push({articulo, nombre, precio:Number(precio), cantidad:1}); renderCarrito(); }
function renderCarrito(){ const div=document.getElementById('carrito-lista'); let total=0; div.innerHTML=''; if(carrito.length===0) div.innerHTML='<small class="small">Carrito vacío</small>'; carrito.forEach((it,i)=>{ const sub=it.precio*it.cantidad; total+=sub; div.innerHTML+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F1F5F9"><div style="flex:1"><div style="font-weight:700;font-size:13px">${it.nombre}</div><div style="font-size:11px;color:#64748B">${it.articulo}</div><div style="color:#047857;font-weight:700;font-size:13px">$${it.precio.toFixed(2)} x ${it.cantidad} = $${sub.toFixed(2)}</div></div><div style="display:flex;align-items:center;gap:6px"><button onclick="cambiarCant(${i},-1)" style="width:26px;height:26px;border-radius:8px;border:1px solid #E2E8F0">-</button><b>${it.cantidad}</b><button onclick="cambiarCant(${i},1)" style="width:26px;height:26px;border-radius:8px;border:1px solid #E2E8F0">+</button><span onclick="carrito.splice(${i},1);renderCarrito()" style="cursor:pointer">✕</span></div></div>`; }); document.getElementById('total').innerText=`Total: $${total.toFixed(2)}`; document.getElementById('count').innerText=carrito.reduce((s,p)=>s+p.cantidad,0); }
function cambiarCant(i,d){ carrito[i].cantidad+=d; if(carrito[i].cantidad<=0) carrito.splice(i,1); renderCarrito(); }
document.getElementById('buscador').addEventListener('input', e=>{ const q=e.target.value.toLowerCase(); const f=todos.filter(p=>(p.nombre||'').toLowerCase().includes(q)||(p.cve||'').toLowerCase().includes(q)); renderProductos(f); });
function obtenerUbicacion(){ const st=document.getElementById('loc-status'); st.innerText='Obteniendo...'; navigator.geolocation.getCurrentPosition(pos=>{ myLat=pos.coords.latitude.toFixed(6); myLng=pos.coords.longitude.toFixed(6); st.innerHTML=`✅ ${myLat}, ${myLng} <a href="https://maps.google.com/?q=${myLat},${myLng}" target="_blank">Ver</a>`; }, err=>{ st.innerText='Error: '+err.message; }); }
async function hacerPedido(){
  if(carrito.length===0) return alert('Carrito vacío');
  if(!clienteActual){ abrirLogin(); return alert('Primero inicia sesión'); }
  const nombre=document.getElementById('nombre').value.trim(); const telefono=document.getElementById('telefono').value.trim(); const direccion=document.getElementById('direccion').value.trim();
  if(!nombre||!telefono||!direccion) return alert('Falta nombre/tel/dirección');
  const total=carrito.reduce((s,p)=>s+p.precio*p.cantidad,0);
  document.getElementById('btn-pedido').disabled=true; document.getElementById('msg').innerText='Guardando en SYSPTV...';
  try{ const res=await fetch('/api/pedidos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre, telefono, direccion, lat:myLat, lng:myLng, total, productos: carrito.map(p=>({cve:p.articulo, cantidad:p.cantidad, precio:p.precio}))})}); const j=await res.json(); if(j.ok){ document.getElementById('msg').innerHTML=`✅ Pedido #${j.folio} guardado $${j.total.toFixed(2)}`; carrito=[]; renderCarrito(); } else document.getElementById('msg').innerText='❌ '+j.error; }catch(e){ document.getElementById('msg').innerText='❌ '+e.message; }
  document.getElementById('btn-pedido').disabled=false;
}
init();
</script></body></html>
