<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FarmaBara</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-50">
<header class="bg-white rounded-b-[24px] mx-2 mt-2 p-4 shadow flex justify-between"><h1 class="font-extrabold text-xl">Farma<span class="text-violet-600">Bara</span></h1><span>🛒 <b id="cart">0</b></span></header>
<div class="max-w-7xl mx-auto p-4"><div id="grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div></div>
<script>
async function load(){
  const res = await fetch('./productos.json'); const prods = await res.json();
  document.getElementById('grid').innerHTML = prods.map(p=>`
    <div class="bg-white rounded-[22px] p-4 shadow">
      <img src="/img/${p.sku}.jpg" onerror="this.src='https://via.placeholder.com/300?text=${p.sku}'" class="w-full h-44 object-contain bg-gray-50 rounded-xl">
      <h3 class="font-bold mt-3 text-sm">${p.nombre}</h3>
      <p class="text-[11px] text-gray-500">SKU: ${p.sku}</p>
      <p class="font-extrabold text-xl mt-2">$${p.precio} MXN</p>
      <button onclick="cart.innerText++" class="w-full mt-3 bg-violet-600 text-white py-3 rounded-full font-bold">Agregar</button>
    </div>`).join('');
} load();
</script>
</body></html>
