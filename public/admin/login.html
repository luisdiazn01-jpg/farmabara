<!DOCTYPE html><html><head><meta charset="utf-8"><title>Login Admin</title>
<style>body{font-family:Arial;background:#111;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh}.box{background:#222;padding:30px;border-radius:10px;width:300px} input{width:100%;padding:10px;margin:8px 0;border-radius:5px;border:none} button{width:100%;padding:10px;background:#0f0;color:#000;font-weight:bold;border:none;border-radius:5px;cursor:pointer}</style></head>
<body><div class="box"><h2>Admin SysPtv</h2><input id="u" placeholder="usuario" value="admin"><input id="p" type="password" placeholder="pass"><button onclick="login()">Entrar</button><p id="msg"></p></div>
<script>
async function login(){
  const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:document.getElementById('u').value,password:document.getElementById('p').value})});
  const j=await r.json(); if(j.ok) location.href='/admin/index.html'; else document.getElementById('msg').innerText=j.error;
}
</script></body></html>
